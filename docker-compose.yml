services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:dev
    container_name: ha_radar_dev
    volumes:
      - ./ha_config:/config
      - ./custom_components/radar_zone_presence:/config/custom_components/radar_zone_presence
      - ./dev/radar_sim:/config/custom_components/radar_sim
      - ./dev/data:/data:ro
    ports:
      # dev/configuration.yaml serves on 8124 (offset from ha-tides on 8123).
      - "8124:8124"
      - "5679:5678"   # debugpy
    environment:
      - TZ=America/Los_Angeles
      - RADAR_SIM_DATA=/data
    restart: unless-stopped
